name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活 IDF 环境
          . /opt/esp/idf/export.sh

          # 2. 保持兼容的组件管理器版本
          python -m pip install "idf-component-manager~=2.1.0"

          cd application/edge_agent

          # 3. 如果官方根目录存在 build.sh，优先使用官方脚本；否则手动补齐预生成
          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh -c breadboard
          elif [ -f "../../tools/build.sh" ]; then
            chmod +x ../../tools/build.sh
            ../../tools/build.sh -c breadboard
          else
            # 若无 build.sh，手动触发元数据生成脚本或创建空文件占位
            mkdir -p components/gen_bmgr_codes
            if [ -f "components/gen_bmgr_codes/gen_board_metadata.py" ]; then
              python components/gen_bmgr_codes/gen_board_metadata.py --board breadboard
            else
              touch components/gen_bmgr_codes/gen_board_metadata.yaml
            fi
            CONFIG=breadboard IDF_TARGET=esp32s3 idf.py build
          fi

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
