name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活 IDF 环境
          . /opt/esp/idf/export.sh

          # 2. 锁定兼容的组件管理器版本
          python -m pip install "idf-component-manager~=2.1.0"

          # 3. 针对 claw_event_router 组件强制解除 -Werror
          ROUTER_CMAKE="components/claw_modules/claw_event_router/CMakeLists.txt"
          if [ -f "$ROUTER_CMAKE" ]; then
            echo 'target_compile_options(${COMPONENT_LIB} PRIVATE "-Wno-error=unused-function" "-Wno-error")' >> "$ROUTER_CMAKE"
          fi

          cd application/edge_agent

          # 4. 补齐预构建占位与 Flash 配置
          mkdir -p components/gen_bmgr_codes
          echo "boards: {}" > components/gen_bmgr_codes/gen_board_metadata.yaml
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"8MB\"" >> sdkconfig.defaults
          
          # 5. 全局放宽编译警告等级，不把警告当错误
          echo "CONFIG_COMPILER_WARNINGS_ALL=n" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_WARNINGS_SILENT=y" >> sdkconfig.defaults

          # 6. 执行正式编译
          CONFIG=breadboard IDF_TARGET=esp32s3 idf.py build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
