name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活 IDF 环境
          . /opt/esp/idf/export.sh

          # 2. 锁定兼容的组件管理器版本
          python -m pip install "idf-component-manager~=2.1.0"

          # 3. 彻底清除所有组件中的 -Werror 限制，防止警告中断构建
          find components -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i 's/-Werror=all//g' {} +
          find components -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i 's/-Werror//g' {} +

          # 4. 进入工程目录并补齐元数据与 Flash 配置
          cd application/edge_agent
          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i 's/-Werror=all//g' {} +
          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i 's/-Werror//g' {} +

          mkdir -p components/gen_bmgr_codes
          echo "boards: {}" > components/gen_bmgr_codes/gen_board_metadata.yaml
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"8MB\"" >> sdkconfig.defaults

          # 5. 执行正式编译
          CONFIG=breadboard IDF_TARGET=esp32s3 idf.py build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
