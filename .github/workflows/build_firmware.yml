name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        env:
          # 告诉 ESP-Claw 编译目标配置（breadboard 针对标准 ESP32-S3 开发板）
          CONFIG: "breadboard"
        with:
          esp_idf_version: v5.1.4
          target: esp32s3
          path: 'application/edge_agent'

      - name: Merge Binaries
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
