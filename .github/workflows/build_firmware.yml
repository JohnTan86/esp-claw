name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活 IDF 环境与依赖版本
          . /opt/esp/idf/export.sh
          python -m pip install "idf-component-manager~=2.1.0"

          # 2. 清理全局 -Werror 与修复三元表达式
          python3 -c '
          import os
          for root, _, files in os.walk("."):
              for f in files:
                  p = os.path.join(root, f)
                  if f == "CMakeLists.txt" or f.endswith(".cmake"):
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                              txt = fp.read()
                          if "-Werror" in txt:
                              txt = txt.replace("-Werror=all", "").replace("-Werror", "")
                              with open(p, "w", encoding="utf-8") as fp:
                                  fp.write(txt)
                      except Exception:
                          pass
                  elif f.endswith(".c") or f.endswith(".h"):
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                              txt = fp.read()
                          if "ESP_LOG_LEVEL(rule_err == ESP_OK ? ESP_LOG_DEBUG : ESP_LOG_WARN" in txt:
                              txt = txt.replace(
                                  "ESP_LOG_LEVEL(rule_err == ESP_OK ? ESP_LOG_DEBUG : ESP_LOG_WARN",
                                  "ESP_LOG_LEVEL((rule_err == ESP_OK ? (int)ESP_LOG_DEBUG : (int)ESP_LOG_WARN)"
                              )
                              with open(p, "w", encoding="utf-8") as fp:
                                  fp.write(txt)
                      except Exception:
                          pass
          '

          # 3. 剥离 app_claw 中多余的 CLI/Lua 实现
          APP_CLAW_DIR="components/common/app_claw"
          if [ -d "$APP_CLAW_DIR" ]; then
            echo '#include <stdio.h>' > "$APP_CLAW_DIR/app_claw_cli.c"
            echo 'void app_claw_cli_start(void) {}' >> "$APP_CLAW_DIR/app_claw_cli.c"

            echo '#include <stdio.h>' > "$APP_CLAW_DIR/app_lua_modules.c"
            echo 'void register_app_lua_modules(void) {}' >> "$APP_CLAW_DIR/app_lua_modules.c"

            echo '#include <stdio.h>' > "$APP_CLAW_DIR/app_capabilities.c"
            echo 'void register_app_capabilities(void) {}' >> "$APP_CLAW_DIR/app_capabilities.c"
          fi

          # 4. 【终极扫描桩】：智能扫描整个 app_claw 中引用的所有头文件，只要不存在就自动创建桩文件
          python3 -c '
          import os, re
          inc_dir = "components/common/app_claw/include"
          os.makedirs(inc_dir, exist_ok=True)

          # 提取 components/common/app_claw 下所有头文件引用
          needed = set()
          for root, _, files in os.walk("components/common/app_claw"):
              for f in files:
                  if f.endswith((".c", ".h")):
                      with open(os.path.join(root, f), "r", encoding="utf-8", errors="ignore") as fp:
                          for line in fp:
                              m = re.findall(r"#include\s+[\"<]([\w\.-]+\.h)[\">]", line)
                              for h in m:
                                  needed.add(h)

          # 如果在整棵源码树里搜不到这个头文件，就在 include/ 里创建一个空桩
          for h in needed:
              found = False
              for root, _, files in os.walk("."):
                  if h in files:
                      found = True
                      break
              if not found:
                  stub_path = os.path.join(inc_dir, h)
                  with open(stub_path, "w", encoding="utf-8") as fp:
                      fp.write("#pragma once\n")
                  print(f"Created stub for: {h}")
          '

          cd application/edge_agent

          # 5. 元数据与 Flash 8MB 配置
          mkdir -p components/gen_bmgr_codes
          echo "boards: {}" > components/gen_bmgr_codes/gen_board_metadata.yaml
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"8MB\"" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_WARNINGS_ALL=n" >> sdkconfig.defaults

          # 6. 正式编译
          CONFIG=breadboard IDF_TARGET=esp32s3 idf.py build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
