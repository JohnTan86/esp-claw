name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活环境
          . /opt/esp/idf/export.sh

          # 2. 保持兼容的组件管理器版本
          python -m pip install "idf-component-manager~=2.1.0"

          # 3. 永久写入全局环境变量（彻底防止子进程丢失）
          echo "CONFIG=breadboard" >> $GITHUB_ENV
          export CONFIG="breadboard"
          export IDF_TARGET="esp32s3"

          cd application/edge_agent
          
          # 4. 使用官方 idf.py 并显式注入系统环境
          CONFIG=breadboard IDF_TARGET=esp32s3 idf.py build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
