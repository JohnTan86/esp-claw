name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活环境
          . /opt/esp/idf/export.sh

          # 2. 升级组件管理器以支持新版 if 语法
          python -m pip install --upgrade idf-component-manager

          # 3. 导出项目配置变量并编译
          export CONFIG="breadboard"
          cd application/edge_agent
          
          # 直接编译（无需 set-target 覆盖官方配置）
          idf.py build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
