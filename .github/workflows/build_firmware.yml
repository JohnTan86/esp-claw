name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 激活 IDF 环境
          . /opt/esp/idf/export.sh

          # 2. 安装向下兼容 interface_version 2 且支持新 if 语法的版本
          python -m pip install "idf-component-manager~=2.1.0"

          # 3. 进入工程目录并带参编译
          cd application/edge_agent
          idf.py -DIDF_TARGET=esp32s3 -DCONFIG=breadboard build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
