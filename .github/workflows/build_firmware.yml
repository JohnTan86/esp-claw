name: Build ESP-Claw Custom Firmware

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 直接使用乐鑫官方提供的 v5.3 容器环境
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        shell: bash
        run: |
          # 1. 显式导出 CONFIG 环境变量
          export CONFIG="breadboard"
          export IDF_TARGET="esp32s3"
          
          # 2. 激活 ESP-IDF 环境并编译
          . /opt/esp/idf/export.sh
          cd application/edge_agent
          idf.py set-target esp32s3
          idf.py build

      - name: Merge Binaries
        shell: bash
        run: |
          pip install esptool
          cd application/edge_agent/build
          esptool.py --chip esp32s3 merge_bin -o esp_claw_merged.bin @flash_args

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-s3-cam-firmware
          path: application/edge_agent/build/esp_claw_merged.bin
